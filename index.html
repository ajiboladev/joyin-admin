    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #5b53f2;
            --primary-light: #6a63f4;
            --primary-dark: #4a42e0;
            --dark: #0a0a0a;
            --darker: #000000;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--darker);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--darker) 0%, #1a1a2e 100%);
            overflow: hidden;
            z-index: -1;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: 10%;
            animation-delay: -5s;
            animation-duration: 15s;
        }

        .circle-3 {
            width: 150px;
            height: 150px;
            top: 30%;
            right: -75px;
            animation-delay: -10s;
            animation-duration: 25s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, 20px) rotate(90deg); }
            50% { transform: translate(0, 40px) rotate(180deg); }
            75% { transform: translate(-20px, 20px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Loading container */
        .loading-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Logo */
        .logo {
            margin-bottom: 40px;
            animation: logoPulse 2s infinite ease-in-out;
        }

        .logo-icon {
            font-size: 60px;
            color: var(--primary);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(91, 83, 242, 0.5));
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(91, 83, 242, 0.7);
        }

        .logo-subtext {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Loader animation */
        .loader {
            width: 120px;
            height: 120px;
            margin: 30px auto;
            position: relative;
        }

        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: var(--primary);
            animation: spin 2s linear infinite;
        }

        .loader-ring:nth-child(1) {
            border-width: 6px;
            border-top-color: var(--primary);
            border-right-color: rgba(91, 83, 242, 0.3);
            border-bottom-color: rgba(91, 83, 242, 0.3);
            border-left-color: rgba(91, 83, 242, 0.3);
        }

        .loader-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border-width: 4px;
            border-top-color: var(--primary-light);
            animation: spin 1.5s linear infinite reverse;
        }

        .loader-ring:nth-child(3) {
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
            border-width: 3px;
            border-top-color: var(--primary-dark);
            animation: spin 1s linear infinite;
        }

        .loader-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--primary);
            animation: dotPulse 1.5s infinite ease-in-out;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes dotPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 0 0 20px var(--primary);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2);
                box-shadow: 0 0 30px var(--primary);
            }
        }

        /* Loading text */
        .loading-text {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .loading-subtext {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 300px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Progress bar */
        .progress-container {
            width: 300px;
            max-width: 90%;
            margin: 20px auto;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 10px;
            animation: progress 5s linear forwards;
            box-shadow: 0 0 10px rgba(91, 83, 242, 0.5);
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .progress-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }

        /* Countdown */
        .countdown {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 20px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(91, 83, 242, 0.2);
        }

        .countdown-number {
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
        }

        /* Footer */
        .loading-footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(91, 83, 242, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .security-badge i {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-icon { font-size: 50px; }
            .logo-text { font-size: 28px; }
            .loader { width: 100px; height: 100px; }
            .loading-text { font-size: 16px; }
            .progress-container { width: 250px; }
        }

        @media (max-width: 480px) {
            .logo-icon { font-size: 40px; }
            .logo-text { font-size: 24px; }
            .logo-subtext { font-size: 12px; }
            .loader { width: 80px; height: 80px; }
            .loading-text { font-size: 15px; }
            .loading-subtext { font-size: 13px; }
            .progress-container { width: 200px; }
        }

        /* Install Button Styles */
        .install-container {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .install-btn {
            width: 100%;
            padding: 14px;
            background: rgba(91, 83, 242, 0.15);
            border: 2px solid #5b53f2;
            border-radius: 12px;
            color: #5b53f2;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .install-btn:hover {
            background: rgba(91, 83, 242, 0.25);
            transform: translateY(-2px);
        }

        .install-btn svg {
            width: 20px;
            height: 20px;
        }

        .install-success {
            text-align: center;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: #10b981;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2"></div>
        <div class="bg-circle circle-3"></div>
    </div>

    <!-- Loading Content -->
    <div class="loading-container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-crown"></i>
            </div>
            <div class="logo-text">JOYIN Admin</div>
            <div class="logo-subtext">SECURE CONTROL PANEL</div>
        </div>

        <!-- Loading Animation -->
        <div class="loader">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-dot"></div>
        </div>

        <!-- Loading Text -->
        <div class="loading-text">Initializing Admin System</div>
        <div class="loading-subtext">
            Loading secure modules and preparing your dashboard...
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-text">
                <span>Starting</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <!-- Countdown -->
        <div class="countdown">
            Redirecting in <span class="countdown-number" id="countdown">5</span> seconds
        </div>
    </div>

    <!-- Footer -->
    <div class="loading-footer">
        <div class="security-badge">
            <i class="fas fa-shield-alt"></i>
            <span>Secure Connection • Encrypted Session</span>
        </div>
    </div>

    <!-- Install App Section -->
    <div class="install-container" id="installContainer" style="display: none;">
                <button class="install-btn" id="installBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Install Admin App
                </button>
            </div>

            <!-- Success Message -->
            <div class="install-success" id="installSuccess" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                App installed successfully!
            </div>

            <!-- PWA Installation Script -->
    <script src="/pwa-install.js"></script>
    
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/admin-sw.js')
                    .then(registration => {
                        console.log('✅ Service Worker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ Service Worker registration failed:', error);
                    });
            });
        }
    </script>


    <script>
        // Update progress percentage
        const progressFill = document.querySelector('.progress-fill');
        const progressPercent = document.getElementById('progressPercent');
        const countdownElement = document.getElementById('countdown');
        
        let progress = 0;
        let countdown = 5;
        
        // Update progress every 100ms (50 increments over 5 seconds)
        const progressInterval = setInterval(() => {
            progress += 2; // 100% / 50 increments = 2% each
            progressPercent.textContent = `${progress}%`;
            
            if (progress >= 100) {
                clearInterval(progressInterval);
                progressPercent.textContent = '100%';
            }
        }, 100);
        
        // Update countdown every second
        const countdownInterval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                
                // Add exit animation
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease';
                
                // Redirect after fade out
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
            }
        }, 1000);
        
        // Optional: Skip loading if user clicks
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                clearInterval(progressInterval);
                clearInterval(countdownInterval);
                window.location.href = 'index.html';
            }
        });
        
        // Optional: Skip on click/tap
        document.addEventListener('click', () => {
            clearInterval(progressInterval);
            clearInterval(countdownInterval);
            window.location.href = 'index.html';
        });
        
        // Add some console style
        console.log('%c🔐 JOYIN Admin Loading...', 'color: #5b53f2; font-size: 16px; font-weight: bold;');
        console.log('%c⏳ Initializing secure admin panel...', 'color: #aaa;');
        console.log('%c✅ System checks passed', 'color: #2ed573;');
        console.log('%c🚀 Preparing dashboard...', 'color: #5b53f2;');
    </script>

    <!-- Register the service worker -->

</script>
