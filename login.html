<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOYIN Admin - Login</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/J _ A192.png">
    <link rel="manifest" href="/admin-manifest.json">
    <meta name="theme-color" content="#5b53f2">
    <script src="/admin-pwa-install.js"></script>
    <link rel="icon" href="./J _ A192.png">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1>JOYIN<span>Admin</span></h1>
                <p style="color: var(--text-secondary); margin-top: 8px;">Secure Admin Portal</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Admin Email</label>
                    <input type="email" id="email" placeholder="admin@joyin.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <!-- ERROR MESSAGE ELEMENT WAS MISSING -->
                <div id="errorMessage" style="color: red; display: none; margin: 10px 0; padding: 10px; background: rgba(255,0,0,0.1); border-radius: 5px;"></div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form> <!-- FORM WAS NOT CLOSED -->
        </div> <!-- LOGIN-CARD WAS NOT CLOSED -->
    </div> <!-- LOGIN-CONTAINER WAS NOT CLOSED -->
    
    <!-- Login Script -->
    <script type="module">
        // FIRST: Add error logging
        console.log('Auth script loading...');
        
        // Try with error handling
        import { adminLogin } from './js/auth.js';
        try {
            
            console.log('Auth module loaded successfully');
            
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('Form submitted');
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMessage = document.getElementById('errorMessage');
                const submitBtn = e.target.querySelector('button');
                
                console.log('Attempting login for:', email);
                
                // Show loading
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
                submitBtn.disabled = true;
                errorMessage.style.display = 'none';
                
                try {
                    const result = await adminLogin(email, password);
                    console.log('Login result:', result);
                    
                    if (result.success) {
                        submitBtn.innerHTML = '<i class="fas fa-check"></i> Success! Redirecting...';
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                        submitBtn.disabled = false;
                        errorMessage.textContent = result.error || 'Login failed';
                        errorMessage.style.display = 'block';
                        console.error('Login error:', result.error);
                    }
                } catch (loginError) {
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    submitBtn.disabled = false;
                    errorMessage.textContent = 'System error: ' + loginError.message;
                    errorMessage.style.display = 'block';
                    console.error('Login catch error:', loginError);
                }
            });
        } catch (importError) {
            console.error('Failed to load auth module:', importError);
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Authentication system not loaded. Check console for errors.');
            });
        }
    </script>
</body>
</html>
