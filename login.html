<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOYIN Admin - Login</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="admin-manifest.json">
    <meta name="theme-color" content="#5b53f2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JOYIN Admin">
    
    <style>
        /* PWA Install Button Styles */
        .install-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .install-btn {
            width: 100%;
            padding: 14px 20px;
            background: rgba(91, 83, 242, 0.15);
            border: 2px solid #5b53f2;
            border-radius: 12px;
            color: #5b53f2;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .install-btn:hover {
            background: rgba(91, 83, 242, 0.25);
            transform: translateY(-2px);
        }

        .install-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .install-success {
            padding: 14px 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            color: #10b981;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pwa-info {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1>JOYIN<span>Admin</span></h1>
                <p style="color: var(--text-secondary); margin-top: 8px;">Secure Admin Portal</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Admin Email</label>
                    <input type="email" id="email" placeholder="admin@joyin.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </form>

            <!-- PWA Install Section -->
            <div class="install-section" id="installSection" style="display: none;">
                <button class="install-btn" id="installBtn">
                    <i class="fas fa-download"></i>
                    <span>Install Admin App</span>
                </button>
                <p class="pwa-info">Install for quick access from your home screen</p>
            </div>

            <!-- Install Success Message -->
            <div class="install-success" id="installSuccess" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span>App installed successfully!</span>
            </div>
            
            <div style="text-align: center; margin-top: 30px; color: var(--text-secondary); font-size: 14px;">
                <i class="fas fa-shield-alt"></i> Secure access required
            </div>
        </div>
    </div>
    
    <!-- PWA Install Script -->
    <script>
        // ============================================
        // PWA INSTALL FUNCTIONALITY
        // ============================================
        let deferredPrompt;
        const installSection = document.getElementById('installSection');
        const installBtn = document.getElementById('installBtn');
        const installSuccess = document.getElementById('installSuccess');

        // Check if app is already installed
        function isAppInstalled() {
            // Check if running in standalone mode
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                               window.navigator.standalone === true;
            
            // Check localStorage
            const wasInstalled = localStorage.getItem('joyin-admin-installed') === 'true';
            
            return isStandalone || wasInstalled;
        }

        // Show install section
        function showInstallSection() {
            if (!isAppInstalled()) {
                installSection.style.display = 'block';
                console.log('✅ Install button shown');
            } else {
                console.log('ℹ️ App already installed');
            }
        }

        // Hide install section permanently
        function hideInstallSection() {
            installSection.style.display = 'none';
            localStorage.setItem('joyin-admin-installed', 'true');
            console.log('✅ Install button hidden permanently');
        }

        // Show success message
        function showSuccessMessage() {
            installSuccess.style.display = 'flex';
            setTimeout(() => {
                installSuccess.style.display = 'none';
            }, 5000);
        }

        // Capture install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('📱 Install prompt captured');
            e.preventDefault();
            deferredPrompt = e;
            showInstallSection();
        });

        // Handle install button click
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) {
                console.warn('⚠️ Install prompt not available');
                alert('Install option not available. Please use Chrome, Edge, or Safari browser.');
                return;
            }

            console.log('🔄 Showing install prompt...');
            
            // Show loading state
            installBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Installing...</span>';
            installBtn.disabled = true;

            // Show the install prompt
            deferredPrompt.prompt();

            // Wait for user's response
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`📱 User response: ${outcome}`);

            if (outcome === 'accepted') {
                console.log('✅ User accepted install');
                hideInstallSection();
                showSuccessMessage();
            } else {
                console.log('❌ User dismissed install');
                // Restore button
                installBtn.innerHTML = '<i class="fas fa-download"></i> <span>Install Admin App</span>';
                installBtn.disabled = false;
            }

            // Clear the prompt
            deferredPrompt = null;
        });

        // Listen for successful installation
        window.addEventListener('appinstalled', () => {
            console.log('🎉 App installed successfully');
            hideInstallSection();
            showSuccessMessage();
        });

        // Check on page load
        window.addEventListener('load', () => {
            console.log('🔍 Checking install status...');
            if (isAppInstalled()) {
                console.log('✅ App is installed, hiding button');
                hideInstallSection();
            } else {
                console.log('ℹ️ App not installed');
            }
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/admin-sw.js')
                    .then(registration => {
                        console.log('✅ Admin SW registered:', registration.scope);
                    })
                    .catch(error => {
                        console.error('❌ Admin SW registration failed:', error);
                    });
            });
        }
    </script>

    <!-- Login Script -->
    <script type="module">
        import { adminLogin } from './js/auth.js';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = e.target.querySelector('button');
            
            // Show loading
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            submitBtn.disabled = true;
            errorMessage.style.display = 'none';
            
            const result = await adminLogin(email, password);
            
            if (result.success) {
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Success! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                submitBtn.disabled = false;
                errorMessage.textContent = result.error || 'Login failed';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
