<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Feedback Admin — JOYIN</title>
    <link rel="stylesheet" href="./feedback.css" />
    <link rel="icon" href="../J _ A192.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="manifest" href="../admin-manifest.json" />
    <meta name="theme-color" content="#5b53f2" />
    <script src="../admin-pwa-install.js"></script>
  </head>
  <body>
    <!-- ─────────────────────────────────────────────
         PAGE WRAPPER
    ───────────────────────────────────────────── -->
    <div class="page-wrapper" style="max-width: 900px">
      <!-- Back button -->
      <button onclick="history.back()" class="back-btn" title="Go back">
        <i class="fas fa-arrow-left"></i>
      </button>

      <!-- ── ADMIN HEADER ── -->
      <div class="admin-page-header">
        <h1><i class="fas fa-user-shield"></i> Feedback Admin Panel</h1>
        <p>
          Read, reply to, and manage user feedback. All actions are saved to
          Firebase.
        </p>
      </div>

      <!-- ── STATS ROW ── -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card__num" id="statTotal">—</div>
          <div class="stat-card__label">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__num" id="statNew">—</div>
          <div class="stat-card__label">Unread</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__num" id="statReplied">—</div>
          <div class="stat-card__label">Replied</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__num" id="statToday">—</div>
          <div class="stat-card__label">Today</div>
        </div>
      </div>

      <!-- ── TOOLBAR (filter + search) ── -->
      <div class="toolbar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="new">New</button>
        <button class="filter-btn" data-filter="replied">Replied</button>
        <button class="filter-btn" data-filter="idea">Ideas</button>
        <button class="filter-btn" data-filter="bug">Bugs</button>
        <button class="filter-btn" data-filter="praise">Praise</button>

        <div class="search-wrap">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search by name, email or message…"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- ── FEEDBACK LIST ── -->
      <div id="adminFeedbackList">
        <!-- Items injected by JS -->
      </div>

      <!-- ── PAGINATION FOOTER ── -->
      <div class="pagination-footer" id="adminPaginationFooter">
        <!-- Load More button injected by JS -->
      </div>
    </div>
    <!-- /.page-wrapper -->

    <!-- ── DELETE CONFIRMATION MODAL ── -->
    <div class="modal-overlay hidden" id="deleteModal">
      <div class="modal-box">
        <h3>🗑️ Delete Feedback?</h3>
        <p>
          This action cannot be undone. The feedback and any reply will be
          permanently removed from Firebase.
        </p>
        <div class="modal-actions">
          <button class="btn btn-cancel" id="cancelDeleteBtn">Cancel</button>
          <button class="btn btn-delete" id="confirmDeleteBtn">
            <i class="fas fa-trash-alt"></i> Delete
          </button>
        </div>
      </div>
    </div>

    <!-- ── TOAST ── -->
    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <!-- Admin script (ES module) -->
    <script type="module" src="./feedback-admin.js"></script>
  </body>
</html>
