<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Management - JOYIN Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="icon" type="image/x-icon" href="/J _ A192.png">

    <link rel="manifest" href="/admin-manifest.json">
<meta name="theme-color" content="#5b53f2">
<script src="/pwa-install.js"></script>
</head>
<body>
    <header class="admin-header">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-crown"></i> JOYIN Admin
            </div>
            
            <nav class="admin-nav">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a href="users.html" class="nav-link">
                    <i class="fas fa-users"></i> Users
                </a>
                <a href="posts.html" class="nav-link active">
                    <i class="fas fa-newspaper"></i> Posts
                </a>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
                <button id="installButton" class="pwa-install-btn" style="display: none;">
                    <i class="fas fa-download"></i> Install App
                </button>
            </nav>
        </div>
    </header>

    <style>
        .pwa-install-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    /* display: inline-flex; */
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(91, 83, 242, 0.3);
    transition: all 0.3s ease;
    /* position: fixed; */
    bottom: 20px;
    right: 20px;
    z-index: 1000;
}

.pwa-install-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(91, 83, 242, 0.5);
}

.pwa-install-btn:active {
    transform: translateY(1px);
}
    </style>

    <script>
        const installButton = document.getElementById('installButton');
let installPrompt = null;

// Step 1: ALWAYS show the button immediately
installButton.style.display = 'flex';

// Step 2: Check if app is already installed (hide button if yes)
if (localStorage.getItem('pwaInstalled') === 'true') {
    installButton.style.display = 'none';
}

// Step 3: When clicked, trigger install prompt
installButton.addEventListener('click', async () => {
    if (installPrompt) {
        // Show the browser's native install prompt
        installPrompt.prompt();
        
        // Wait for user's decision
        const { outcome } = await installPrompt.userChoice;
        
        if (outcome === 'accepted') {
            // Hide button and mark as installed
            installButton.style.display = 'none';
            localStorage.setItem('pwaInstalled', 'true');
        } else {
            // User declined - keep button visible
            console.log('User declined installation');
        }
    } else {
        // If prompt not ready, tell user how to install manually
        alert("Please use your browser's menu to install:\n\nChrome: Tap ⋮ → 'Install app'\nSafari: Tap Share → 'Add to Home Screen'");
    }
});

// Step 4: Capture the install prompt when browser allows it
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installPrompt = e;
    console.log('Install prompt is now available');
});

// Step 5: When app gets installed, hide the button
window.addEventListener('appinstalled', () => {
    console.log('App was installed');
    installButton.style.display = 'none';
    localStorage.setItem('pwaInstalled', 'true');
});

// Step 6: Detect if app is deleted (check on each page load)
window.addEventListener('load', () => {
    // If running in standalone mode (installed), hide button
    if (window.matchMedia('(display-mode: standalone)').matches) {
        installButton.style.display = 'none';
        localStorage.setItem('pwaInstalled', 'true');
    } else {
        // If not in standalone mode, check localStorage
        // If we think it's installed but not in standalone mode, it was deleted
        if (localStorage.getItem('pwaInstalled') === 'true') {
            console.log('App was deleted - showing button again');
            // Keep the button visible since app was deleted
            installButton.style.display = 'flex';
        }
    }
});

// Step 7: Clear localStorage if you want to test the button showing again
// To test: Open browser console and type: localStorage.removeItem('pwaInstalled')
    </script>

    <main class="dashboard-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="color: var(--text);">
                <i class="fas fa-newspaper" style="color: var(--primary); margin-right: 10px;"></i>
                Post Management
            </h1>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="searchPosts" class="search-box" placeholder="Search posts by content or user...">
                <div class="date-filter">
                    <input type="date" id="dateFrom" class="date-input" title="From date">
                    <input type="date" id="dateTo" class="date-input" title="To date">
                    <button id="applyDateFilter" class="action-btn btn-primary">
                        <i class="fas fa-filter"></i> Filter
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Quick Stats -->
        <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 30px;">
            <div class="stat-card">
                <div class="stat-value" id="totalPosts">0</div>
                <div class="stat-label">Total Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayPosts">0</div>
                <div class="stat-label">Posts Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="withImages">0</div>
                <div class="stat-label">With Images</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avgLikes">0</div>
                <div class="stat-label">Avg. Likes</div>
            </div>
        </div>
        
        <!-- Posts Table -->
        <div class="table-container">
            <div class="table-header">
                <div class="table-title">
                    <i class="fas fa-stream"></i> All Posts (<span id="postCount">0</span>)
                </div>
                <div>
                    <button id="bulkDelete" class="action-btn btn-danger" style="display: none;">
                        <i class="fas fa-trash"></i> Delete Selected
                    </button>
                </div>
            </div>
            
            <table class="table">
                <thead>
                    <tr>
                        <th style="width: 50px;">
                            <input type="checkbox" id="selectAllPosts">
                        </th>
                        <th>Content</th>
                        <th>User</th>
                        <th>Date</th>
                        <th>Likes</th>
                        <th>Image</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="postsTable">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 60px;">
                            <div class="loading" style="height: 40px; margin: 0 auto;"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Pagination -->
            <div style="padding: 20px; border-top: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center;">
                <div style="color: var(--text-secondary); font-size: 14px;">
                    Showing <span id="showingPosts">0</span> of <span id="totalPostsCount">0</span> posts
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="prevPage" class="action-btn" disabled>
                        <i class="fas fa-chevron-left"></i> Previous
                    </button>
                    <span id="pageInfo" style="color: var(--text); padding: 8px 16px;">Page 1</span>
                    <button id="nextPage" class="action-btn" disabled>
                        Next <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Post Preview Modal -->
    <div id="postModal" class="modal-overlay" style="display: none;">
        <div class="modal" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title">Post Preview</h3>
                <button class="close-modal" id="closePostModal">&times;</button>
            </div>
            <div id="postDetails" style="max-height: 70vh; overflow-y: auto;">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <script type="module">
        import { getAllPosts } from './js/dashboard.js';
        import { deletePost } from './js/posts.js';
        import { adminLogout, checkAdminAuth } from './js/auth.js';
        
        // Check admin auth
        const user = await checkAdminAuth();
        if (!user) window.location.href = 'index.html';
        
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', adminLogout);
        
        let allPosts = [];
        let filteredPosts = [];
        let currentPage = 1;
        const postsPerPage = 10;
        let selectedPosts = new Set();
        
        // Load posts
        async function loadPosts() {
            try {
                allPosts = await getAllPosts();
                applyPostFilters();
                updatePostTable();
                updatePostStats();
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('postsTable').innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: var(--danger);">
                            <i class="fas fa-exclamation-triangle"></i> Failed to load posts
                        </td>
                    </tr>
                `;
            }
        }
        
        // Update stats
        function updatePostStats() {
            const today = new Date().toDateString();
            const todayPosts = allPosts.filter(post => {
                const postDate = post.createdAt?.toDate ? 
                    post.createdAt.toDate().toDateString() : 
                    new Date(post.createdAt).toDateString();
                return postDate === today;
            }).length;
            
            const postsWithImages = allPosts.filter(post => post.imageUrl).length;
            const totalLikes = allPosts.reduce((sum, post) => sum + (post.likeCount || 0), 0);
            const avgLikes = allPosts.length > 0 ? Math.round(totalLikes / allPosts.length) : 0;
            
            document.getElementById('totalPosts').textContent = allPosts.length;
            document.getElementById('todayPosts').textContent = todayPosts;
            document.getElementById('withImages').textContent = postsWithImages;
            document.getElementById('avgLikes').textContent = avgLikes;
        }
        
        // Apply filters
        function applyPostFilters() {
            let posts = [...allPosts];
            const searchTerm = document.getElementById('searchPosts').value.toLowerCase();
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            
            // Search filter
            if (searchTerm) {
                posts = posts.filter(p => 
                    (p.text || '').toLowerCase().includes(searchTerm) ||
                    (p.username || '').toLowerCase().includes(searchTerm)
                );
            }
            
            // Date filter
            if (dateFrom) {
                const fromDate = new Date(dateFrom);
                posts = posts.filter(p => {
                    const postDate = p.createdAt?.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
                    return postDate >= fromDate;
                });
            }
            
            if (dateTo) {
                const toDate = new Date(dateTo);
                toDate.setHours(23, 59, 59, 999);
                posts = posts.filter(p => {
                    const postDate = p.createdAt?.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
                    return postDate <= toDate;
                });
            }
            
            filteredPosts = posts;
            currentPage = 1;
        }
        
        // Update table
        function updatePostTable() {
            const start = (currentPage - 1) * postsPerPage;
            const end = start + postsPerPage;
            const pagePosts = filteredPosts.slice(start, end);
            
            document.getElementById('postCount').textContent = filteredPosts.length;
            document.getElementById('totalPostsCount').textContent = filteredPosts.length;
            document.getElementById('showingPosts').textContent = `${start + 1}-${Math.min(end, filteredPosts.length)}`;
            
            // Update pagination
            document.getElementById('prevPage').disabled = currentPage === 1;
            document.getElementById('nextPage').disabled = end >= filteredPosts.length;
            document.getElementById('pageInfo').textContent = `Page ${currentPage}`;
            
            // Update table rows
            const tbody = document.getElementById('postsTable');
            tbody.innerHTML = '';
            
            if (pagePosts.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            <i class="fas fa-newspaper"></i> No posts found
                        </td>
                    </tr>
                `;
                return;
            }
            
            pagePosts.forEach(post => {
                const postDate = post.createdAt?.toDate ? 
                    post.createdAt.toDate() : 
                    new Date(post.createdAt);
                const hasImage = post.imageUrl && post.imageUrl.trim() !== '';
                const previewText = post.text ? 
                    (post.text.length > 100 ? post.text.substring(0, 100) + '...' : post.text) : 
                    '[No text]';
                
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <input type="checkbox" class="post-checkbox" value="${post.id}" 
                                   ${selectedPosts.has(post.id) ? 'checked' : ''}>
                        </td>
                        <td>
                            <div class="post-preview">
                                ${previewText}
                            </div>
                            <button onclick="viewPostDetails('${post.id}')" 
                                    class="action-btn" 
                                    style="padding: 4px 8px; font-size: 12px; margin-top: 5px;">
                                <i class="fas fa-expand"></i> View Full
                            </button>
                        </td>
                        <td>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <img src="${post.userProfilePic || 'https://tse1.mm.bing.net/th/id/OIP.cEvbluCvNFD_k4wC3k-_UwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3'}" 
                                     style="width: 30px; height: 30px; border-radius: 50%;">
                                <span>${post.username || 'Unknown'}</span>
                            </div>
                        </td>
                        <td>
                            ${postDate.toLocaleDateString()}<br>
                            <small style="color: var(--text-secondary);">
                                ${postDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                            </small>
                        </td>
                        <td>
                            <span style="color: ${post.likeCount > 0 ? '#5b53f2' : '#aaa'};">
                                <i class="fas fa-heart"></i> ${post.likeCount || 0}
                            </span>
                        </td>
                        <td>
                            ${hasImage ? 
                                `<span class="status-badge badge-active" style="background: rgba(91, 83, 242, 0.1);">
                                    <i class="fas fa-image"></i> Yes
                                </span>` : 
                                `<span style="color: var(--text-secondary);">No</span>`
                            }
                        </td>
                        <td>
                            <div style="display: flex; gap: 5px;">
                                <button onclick="viewPostDetails('${post.id}')" 
                                        class="action-btn" title="Preview">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button onclick="deleteSinglePost('${post.id}')" 
                                        class="action-btn btn-danger" title="Delete">
                                    <i class="fas fa-trash"></i>
                                </button>
                                <button onclick="gotoUser('${post.userId}')" 
                                        class="action-btn btn-primary" title="View User">
                                    <i class="fas fa-user"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            // Update bulk delete button
            document.getElementById('bulkDelete').style.display = 
                selectedPosts.size > 0 ? 'inline-block' : 'none';
        }
        
        // View post details
        window.viewPostDetails = async function(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            
            const postDate = post.createdAt?.toDate ? 
                post.createdAt.toDate() : 
                new Date(post.createdAt);
            
            document.getElementById('postDetails').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
                        <img src="${post.userProfilePic || 'https://tse1.mm.bing.net/th/id/OIP.cEvbluCvNFD_k4wC3k-_UwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3'}" 
                             style="width: 60px; height: 60px; border-radius: 50%;">
                        <div>
                            <h4 style="margin: 0;">${post.username || 'Unknown User'}</h4>
                            <p style="color: var(--text-secondary); margin: 5px 0 0 0;">
                                ${postDate.toLocaleString()}
                            </p>
                            <button onclick="gotoUser('${post.userId}')" 
                                    class="action-btn btn-primary" 
                                    style="padding: 4px 8px; font-size: 12px; margin-top: 5px;">
                                <i class="fas fa-external-link-alt"></i> View User Profile
                            </button>
                        </div>
                    </div>
                    
                    <div style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                        <p style="white-space: pre-wrap; line-height: 1.6;">${post.text || '[No text content]'}</p>
                    </div>
                    
                    ${post.imageUrl ? `
                        <div style="margin-bottom: 20px;">
                            <div class="stat-label" style="margin-bottom: 10px;">Image</div>
                            <img src="${post.imageUrl}" 
                                 style="max-width: 100%; border-radius: 10px; border: 1px solid var(--card-border);"
                                 onerror="this.style.display='none';">
                        </div>
                    ` : ''}
                    
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;">
                        <div class="stat-card" style="padding: 15px;">
                            <div class="stat-label">Likes</div>
                            <div class="stat-value">${post.likeCount || 0}</div>
                        </div>
                        <div class="stat-card" style="padding: 15px;">
                            <div class="stat-label">Post ID</div>
                            <div style="font-size: 12px; color: var(--text-secondary); font-family: monospace;">
                                ${post.id.substring(0, 16)}...
                            </div>
                        </div>
                        <div class="stat-card" style="padding: 15px;">
                            <div class="stat-label">User ID</div>
                            <div style="font-size: 12px; color: var(--text-secondary); font-family: monospace;">
                                ${post.userId.substring(0, 16)}...
                            </div>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 10px; justify-content: center;">
                        <button onclick="deleteSinglePost('${post.id}', true)" 
                                class="action-btn btn-danger" style="flex: 1;">
                            <i class="fas fa-trash"></i> Delete Post
                        </button>
                        <button onclick="window.open('${post.imageUrl}', '_blank')" 
                                ${!post.imageUrl ? 'disabled' : ''}
                                class="action-btn btn-primary" style="flex: 1;">
                            <i class="fas fa-external-link-alt"></i> Open Image
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('postModal').style.display = 'flex';
        };
        
        // Delete single post
        window.deleteSinglePost = async function(postId, fromModal = false) {
            if (confirm('Delete this post? This action cannot be undone.')) {
                const result = await deletePost(postId);
                
                if (result.success) {
                    alert(result.message);
                    loadPosts(); // Refresh the list
                    if (fromModal) {
                        document.getElementById('postModal').style.display = 'none';
                    }
                } else {
                    alert('Error: ' + result.error);
                }
            }
        };
        
        // Go to user
        window.gotoUser = function(userId) {
            window.location.href = `users.html#${userId}`;
        };
        
        // Close modal
        document.getElementById('closePostModal').addEventListener('click', () => {
            document.getElementById('postModal').style.display = 'none';
        });
        
        // Close modal on overlay click
        document.getElementById('postModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('postModal')) {
                document.getElementById('postModal').style.display = 'none';
            }
        });
        
        // Select all checkbox
        document.getElementById('selectAllPosts').addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.post-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = this.checked;
                if (this.checked) {
                    selectedPosts.add(cb.value);
                } else {
                    selectedPosts.delete(cb.value);
                }
            });
            updateBulkDeleteButton();
        });
        
        // Individual checkbox
        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('post-checkbox')) {
                if (e.target.checked) {
                    selectedPosts.add(e.target.value);
                } else {
                    selectedPosts.delete(e.target.value);
                    document.getElementById('selectAllPosts').checked = false;
                }
                updateBulkDeleteButton();
            }
        });
        
        function updateBulkDeleteButton() {
            document.getElementById('bulkDelete').style.display = 
                selectedPosts.size > 0 ? 'inline-block' : 'none';
            document.getElementById('bulkDelete').innerHTML = `
                <i class="fas fa-trash"></i> Delete Selected (${selectedPosts.size})
            `;
        }
        
        // Bulk delete
        document.getElementById('bulkDelete').addEventListener('click', async function() {
            if (selectedPosts.size === 0) return;
            
            if (confirm(`Delete ${selectedPosts.size} selected post(s)? This cannot be undone.`)) {
                this.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';
                this.disabled = true;
                
                let successCount = 0;
                let failCount = 0;
                
                for (const postId of selectedPosts) {
                    const result = await deletePost(postId);
                    if (result.success) {
                        successCount++;
                    } else {
                        failCount++;
                        console.error(`Failed to delete post ${postId}:`, result.error);
                    }
                }
                
                selectedPosts.clear();
                loadPosts();
                
                alert(`Deleted ${successCount} post(s) successfully. ${failCount > 0 ? `${failCount} failed.` : ''}`);
                
                this.disabled = false;
            }
        });
        
        // Search
        document.getElementById('searchPosts').addEventListener('input', () => {
            applyPostFilters();
            updatePostTable();
        });
        
        // Date filter
        document.getElementById('applyDateFilter').addEventListener('click', () => {
            applyPostFilters();
            updatePostTable();
        });
        
        // Clear date filter
        document.getElementById('dateFrom').addEventListener('change', function() {
            if (this.value) {
                document.getElementById('dateTo').min = this.value;
            }
        });
        
        document.getElementById('dateTo').addEventListener('change', function() {
            if (this.value && document.getElementById('dateFrom').value) {
                applyPostFilters();
                updatePostTable();
            }
        });
        
        // Pagination
        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                updatePostTable();
            }
        });
        
        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage * postsPerPage < filteredPosts.length) {
                currentPage++;
                updatePostTable();
            }
        });
        
        // Initialize
        loadPosts();
    </script>
</body>
</html>
