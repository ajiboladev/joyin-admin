<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Users — JOYIN Admin</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" type="image/x-icon" href="/J _ A192.png" />
    <link rel="manifest" href="/admin-manifest.json" />
    <meta name="theme-color" content="#5b53f2" />
    <script src="/admin-pwa-install.js"></script>
  </head>
  <body>
    <!-- ── SIDEBAR ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__logo"><i class="fas fa-crown"></i> JOYIN Admin</div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="nav-link"
          ><i class="fas fa-chart-line"></i> Dashboard</a
        >
        <a href="users.html" class="nav-link active"
          ><i class="fas fa-users"></i> Users</a
        >
        <a href="posts.html" class="nav-link"
          ><i class="fas fa-newspaper"></i> Posts</a
        >
        <a href="./Admin-feedback/feedback-admin.html" class="nav-link"
          ><i class="fas fa-comment-dots"></i> Feedback</a
        >
        <a href="./updates/" class="nav-link"
          ><i class="fas fa-bell"></i> Updates</a
        >
        <a href="./video-posts/" class="nav-link"
          ><i class="fas fa-video"></i> Video Posts</a
        >
        <a href="content-search.html" class="nav-link"
          ><i class="fas fa-search"></i> Search Content</a
        >
        <a href="content-delete.html" class="nav-link"
          ><i class="fas fa-trash"></i> Delete Content</a
        >
        <a href="delete-requests.html" class="nav-link"
          ><i class="fas fa-file-circle-xmark"></i> P-delete request</a
        >
        <a href="video-delete-requests.html" class="nav-link"
          ><i class="fas fa-video-slash"></i> V-delete request</a
        >
        <a href="account-delete-requests.html" class="nav-link"
          ><i class="fas fa-user-xmark"></i> Acc-delete request</a
        >
      </nav>
      <div class="sidebar__footer">
        <button id="logoutBtn" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ── TOP BAR ── -->
    <header class="topbar">
      <div class="topbar__title">
        <button class="hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </button>
        <i class="fas fa-users"></i> User Management
      </div>
      <div class="topbar__right">
        <button id="exportBtn" class="btn btn-primary">
          <i class="fas fa-download"></i> Export CSV
        </button>
      </div>
    </header>

    <!-- ── PAGE ── -->
    <main class="page-content">
      <!-- Toolbar -->
      <div class="card" style="margin-bottom: 20px">
        <div class="toolbar">
          <button class="filter-chip active" data-filter="all">
            All Users
          </button>
          <button class="filter-chip" data-filter="active">Active</button>
          <button class="filter-chip" data-filter="banned">Banned</button>

          <div class="search-box" style="flex: 1; min-width: 200px">
            <i class="fas fa-search"></i>
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Search by name, email, or ID…"
            />
          </div>

          <select
            id="sortSelect"
            class="search-box"
            style="width: auto; flex-shrink: 0"
          >
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="name">By name</option>
            <option value="posts">Most posts</option>
          </select>
        </div>

        <!-- Bulk actions bar -->
        <div
          id="bulkBar"
          style="
            display: none;
            padding: 12px 24px;
            background: var(--accent-dim);
            border-top: 1px solid var(--border);
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
          "
        >
          <span
            id="bulkCount"
            style="font-size: 0.85rem; color: var(--accent-l); font-weight: 600"
          ></span>
          <button id="bulkBanBtn" class="btn btn-danger">
            <i class="fas fa-user-slash"></i> Ban Selected
          </button>
          <button id="bulkUnbanBtn" class="btn btn-success">
            <i class="fas fa-user-check"></i> Unban Selected
          </button>
          <button class="btn" onclick="clearSelection()">
            <i class="fas fa-times"></i> Clear
          </button>
        </div>
      </div>

      <!-- Table card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">
            <i class="fas fa-user-friends"></i> Users
            <span
              id="userCountBadge"
              style="
                background: var(--surface-3);
                padding: 2px 10px;
                border-radius: var(--r-full);
                font-size: 0.75rem;
                color: var(--text-2);
              "
              >…</span
            >
          </span>
        </div>

        <div class="table-wrap">
          <table class="table" id="usersTable">
            <thead>
              <tr>
                <th style="width: 44px">
                  <input type="checkbox" id="selectAll" title="Select all" />
                </th>
                <th>User</th>
                <th>Email</th>
                <th>Status</th>
                <th title="Text posts and video posts">Posts / Videos</th>
                <th>Followers</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="pagination">
          <div class="pagination__info">
            Showing <strong id="showingFrom">–</strong>–<strong id="showingTo"
              >–</strong
            >
            of <strong id="totalCount">–</strong> users
          </div>
          <div class="pagination__controls">
            <button id="prevPage" class="btn" disabled>
              <i class="fas fa-chevron-left"></i> Prev
            </button>
            <span id="pageInfo" class="page-info">Page 1</span>
            <button id="nextPage" class="btn">
              Next <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- ── USER DETAIL MODAL ── -->
    <div id="userModal" class="modal-overlay">
      <div class="modal" style="max-width: 600px">
        <div class="modal-header">
          <span class="modal-title"
            ><i class="fas fa-user"></i> User Details</span
          >
          <button class="close-modal" id="closeUserModal">×</button>
        </div>
        <div class="modal-body" id="userModalBody"></div>
        <div class="modal-footer" id="userModalFooter"></div>
      </div>
    </div>

    <script type="module">
      import { getUsersPage } from "./js/dashboard.js";
      import {
        banUser,
        unbanUser,
        getUserPosts,
      } from "./js/users.js";
      import { adminLogout, checkAdminAuth } from "./js/auth.js";
      import {
        showToast,
        showLoading,
        hideLoading,
        showConfirm,
        setupSidebar,
        skeletonRows,
        setButtonLoading,
      } from "./js/ui.js";

      // ── Auth guard ──
      const adminUser = await checkAdminAuth();
      if (!adminUser) window.location.href = "index.html";
      document
        .getElementById("logoutBtn")
        .addEventListener("click", adminLogout);
      setupSidebar();

      // ── State ──
      let allUsers = [];
      let filteredUsers = [];
      let currentPage = 1;
      const PER_PAGE = 10;
      let pageCursors = [null];
      let pageCache = new Map();
      let hasNextPage = false;
      let totalUsers = 0;
      let loadingPage = false;
      let selectedIds = new Set();
      let currentFilter = "all";

      // ================================================================
      // DATE HELPERS
      // ================================================================

      function toDate(v) {
        if (!v) return null;
        if (typeof v.toDate === "function") return v.toDate();
        if (typeof v.seconds === "number") return new Date(v.seconds * 1000);
        const d = new Date(v);
        return isNaN(d.getTime()) ? null : d;
      }

      function formatDate(v, opts = {}) {
        const d = toDate(v);
        if (!d) return "—";
        return d.toLocaleDateString("en-US", opts);
      }

      // ================================================================
      // FIELD HELPERS
      // ================================================================

      function getFollowersCount(u) {
        return Number(u.followersCount) || 0;
      }

      function getPrimaryName(u) {
        return u.displayName || u.username || "No name";
      }

      /**
       * Returns the TOTAL post count (text + video) for a user.
      * Uses the counters/posts document hydrated by getAllUsers().
       */
      function getTotalPostCount(u) {
        return (Number(u.postsCount) || 0) + (Number(u.videosCount) || 0);
      }

      /** Returns the text and video counter breakdown for the table. */
      function getPostCountLabel(u) {
        const posts = Number(u.postsCount) || 0;
        const videos = Number(u.videosCount) || 0;
        return `${posts + videos} <span style="font-size:.7rem;color:var(--text-3);">(${posts} + ${videos} video)</span>`;
      }

      // ================================================================
      // LOAD
      // ================================================================

      async function loadUsers(page = 1, force = false) {
        if (loadingPage) return;
        loadingPage = true;
        document.getElementById("usersBody").innerHTML = skeletonRows(8, 6);

        try {
          let pageData = !force ? pageCache.get(page) : null;
          if (!pageData) {
            pageData = await getUsersPage(
              pageCursors[page - 1] || null,
              PER_PAGE,
            );
            pageCache.set(page, pageData);
            pageCursors[page] = pageData.nextCursor;
          }
          allUsers = pageData.users;
          currentPage = page;
          hasNextPage = pageData.hasNextPage;
          totalUsers = pageData.totalCount;
          applyFiltersAndSort();
          renderTable();
        } catch (err) {
          console.error("Error loading users:", err);
          showToast("Failed to load users.", "error");
          document.getElementById("usersBody").innerHTML = `
                    <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--text-2);">
                        <i class="fas fa-exclamation-triangle" style="font-size:1.5rem;margin-bottom:10px;display:block;color:#f87171;"></i>
                        Failed to load users — <button onclick="location.reload()" style="color:var(--accent-l);background:none;border:none;cursor:pointer;text-decoration:underline;">retry</button>
                    </td></tr>
                `;
        }
              loadingPage = false;
      }

      // ================================================================
      // FILTERS & SORT
      // ================================================================

      function applyFiltersAndSort() {
        let users = [...allUsers];
        const term = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();
        const sort = document.getElementById("sortSelect").value;

        if (term) {
          users = users.filter(
            (u) =>
              (u.username || "").toLowerCase().includes(term) ||
              (u.email || "").toLowerCase().includes(term) ||
              u.id.toLowerCase().includes(term),
          );
        }

        if (currentFilter === "active") {
          users = users.filter(
            (u) => u.isBanned !== true,
          );
        } else if (currentFilter === "banned") {
          users = users.filter(
            (u) => u.isBanned === true,
          );
        }

        if (sort === "newest")
          users.sort(
            (a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0),
          );
        if (sort === "oldest")
          users.sort(
            (a, b) => (toDate(a.createdAt) || 0) - (toDate(b.createdAt) || 0),
          );
        if (sort === "name")
          users.sort((a, b) =>
            (a.username || "").localeCompare(b.username || ""),
          );
        if (sort === "posts")
          users.sort((a, b) => getTotalPostCount(b) - getTotalPostCount(a));

        filteredUsers = users;
      }

      // ================================================================
      // RENDER TABLE
      // ================================================================

      function renderTable() {
        const tbody = document.getElementById("usersBody");
        const page = filteredUsers;

        document.getElementById("userCountBadge").textContent =
          totalUsers;
        document.getElementById("totalCount").textContent =
          totalUsers;
        document.getElementById("showingFrom").textContent =
          filteredUsers.length ? (currentPage - 1) * PER_PAGE + 1 : 0;
        document.getElementById("showingTo").textContent = Math.min(
          currentPage * PER_PAGE,
          (currentPage - 1) * PER_PAGE + filteredUsers.length,
        );
        document.getElementById("pageInfo").textContent = `Page ${currentPage} of ${Math.max(1, Math.ceil(totalUsers / PER_PAGE))}`;
        document.getElementById("prevPage").disabled = currentPage === 1;
        document.getElementById("nextPage").disabled = !hasNextPage;

        if (!page.length) {
          tbody.innerHTML = `
                    <tr><td colspan="8" style="text-align:center;padding:50px;">
                        <div class="empty-state">
                            <i class="fas fa-user-slash"></i>
                            <p>No users match your current filter.</p>
                        </div>
                    </td></tr>
                `;
          return;
        }

        tbody.innerHTML = page
          .map((u) => {
            const banned = u.isBanned === true;
            const joined = formatDate(u.createdAt);
            const followers = getFollowersCount(u);
            const postLabel = getPostCountLabel(u); // includes text+video breakdown
            const checked = selectedIds.has(u.id) ? "checked" : "";
            const pic =
              u.profilePic ||
              "https://tse1.mm.bing.net/th/id/OIP.cEvbluCvNFD_k4wC3k-_UwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3";

            return `
                <tr>
                    <td><input type="checkbox" class="row-check" value="${u.id}" ${checked}></td>
                    <td>
                        <div class="flex-center gap-10">
                            <img src="${pic}" class="avatar" onerror="this.src='https://tse1.mm.bing.net/th/id/OIP.cEvbluCvNFD_k4wC3k-_UwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3'">
                            <div>
                              <strong style="font-size:.875rem;">${getPrimaryName(u)}</strong>
                              ${u.displayName && u.username ? `<div class="text-xs" style="color:var(--text-3);">@${u.username}</div>` : ""}
                                <div class="text-xs text-faint mono">${u.id.substring(0, 10)}…</div>
                            </div>
                        </div>
                    </td>
                    <td class="text-sm text-muted">${u.email || "—"}</td>
                    <td>
                        <span class="badge ${banned ? "badge-banned" : "badge-active"}">
                            <i class="fas ${banned ? "fa-ban" : "fa-check"}"></i>
                            ${banned ? "Banned" : "Active"}
                        </span>
                    </td>
                    <td class="text-sm">${postLabel}</td>
                    <td class="text-sm">${followers}</td>
                    <td class="text-sm text-muted">${joined}</td>
                    <td>
                        <div class="flex-center gap-8">
                            <button class="btn btn-icon" title="View details"
                                    onclick="viewUser('${u.id}')">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-icon ${banned ? "btn-success" : "btn-warning"}"
                                    title="${banned ? "Unban" : "Ban"}"
                                    onclick="toggleBan('${u.id}', ${banned}, this)">
                                <i class="fas ${banned ? "fa-user-check" : "fa-user-slash"}"></i>
                            </button>
                            <button class="btn btn-icon btn-primary" title="View posts"
                                    onclick="window.location.href='posts.html?user=${u.id}'">
                                <i class="fas fa-newspaper"></i>
                            </button>
                        </div>
                    </td>
                </tr>`;
          })
          .join("");

        document
          .querySelectorAll(".row-check")
          .forEach((cb) => cb.addEventListener("change", handleRowCheck));
      }

      // ================================================================
      // CHECKBOX SELECTION
      // ================================================================

      function handleRowCheck(e) {
        const id = e.target.value;
        if (e.target.checked) selectedIds.add(id);
        else {
          selectedIds.delete(id);
          document.getElementById("selectAll").checked = false;
        }
        updateBulkBar();
      }

      function updateBulkBar() {
        const bar = document.getElementById("bulkBar");
        if (selectedIds.size > 0) {
          bar.style.display = "flex";
          document.getElementById("bulkCount").textContent =
            `${selectedIds.size} user${selectedIds.size > 1 ? "s" : ""} selected`;
        } else {
          bar.style.display = "none";
        }
      }

      window.clearSelection = function () {
        selectedIds.clear();
        document.getElementById("selectAll").checked = false;
        document
          .querySelectorAll(".row-check")
          .forEach((cb) => (cb.checked = false));
        updateBulkBar();
      };

      document
        .getElementById("selectAll")
        .addEventListener("change", function () {
          const page = filteredUsers;
          page.forEach((u) => {
            if (this.checked) selectedIds.add(u.id);
            else selectedIds.delete(u.id);
          });
          document
            .querySelectorAll(".row-check")
            .forEach((cb) => (cb.checked = this.checked));
          updateBulkBar();
        });

      // ================================================================
      // TOGGLE BAN
      // ================================================================

      window.toggleBan = async function (userId, isBanned, btn) {
        const confirmed = await showConfirm({
          title: isBanned ? "Unban this user?" : "Ban this user?",
          message: isBanned
            ? "They will regain full access to JOYIN."
            : "They will lose the ability to post or interact.",
          confirmText: isBanned ? "Yes, Unban" : "Yes, Ban",
          intent: isBanned ? "warning" : "danger",
        });
        if (!confirmed) return;

        const restore = setButtonLoading(btn, "");
        try {
          const result = isBanned
            ? await unbanUser(userId)
            : await banUser(userId, "Admin action");
          if (result.success) {
            showToast(result.message, "success");
            await loadUsers();
          } else {
            showToast("Error: " + result.error, "error");
          }
        } catch (err) {
          showToast("Unexpected error.", "error");
        } finally {
          restore();
        }
      };

      // ================================================================
      // BULK BAN / UNBAN
      // ================================================================

      document
        .getElementById("bulkBanBtn")
        .addEventListener("click", async function () {
          if (!selectedIds.size) return;
          const confirmed = await showConfirm({
            title: `Ban ${selectedIds.size} user${selectedIds.size > 1 ? "s" : ""}?`,
            message: "These users will lose the ability to post or interact.",
            confirmText: "Ban All",
            intent: "danger",
          });
          if (!confirmed) return;

          const restore = setButtonLoading(this, "Banning…");
          showLoading(`Banning ${selectedIds.size} users…`);
          try {
            let done = 0;
            for (const id of selectedIds) {
              await banUser(id, "Bulk admin action");
              done++;
            }
            showToast(`${done} user${done > 1 ? "s" : ""} banned.`, "success");
            selectedIds.clear();
            await loadUsers();
          } catch (err) {
            showToast("Some bans failed. Refresh and retry.", "error");
          } finally {
            hideLoading();
            restore();
            updateBulkBar();
          }
        });

      document
        .getElementById("bulkUnbanBtn")
        .addEventListener("click", async function () {
          if (!selectedIds.size) return;
          const confirmed = await showConfirm({
            title: `Unban ${selectedIds.size} user${selectedIds.size > 1 ? "s" : ""}?`,
            message: "These users will regain full access.",
            confirmText: "Unban All",
            intent: "warning",
          });
          if (!confirmed) return;

          const restore = setButtonLoading(this, "Unbanning…");
          showLoading(`Unbanning ${selectedIds.size} users…`);
          try {
            for (const id of selectedIds) await unbanUser(id);
            showToast(
              `${selectedIds.size} user${selectedIds.size > 1 ? "s" : ""} unbanned.`,
              "success",
            );
            selectedIds.clear();
            await loadUsers();
          } catch (err) {
            showToast("Some unbans failed.", "error");
          } finally {
            hideLoading();
            restore();
            updateBulkBar();
          }
        });

      // ================================================================
      // USER DETAIL MODAL
      // ================================================================

      window.viewUser = async function (userId) {
        const user = allUsers.find((u) => u.id === userId);
        if (!user) return;

        document.getElementById("userModal").classList.add("open");
        document.getElementById("userModalBody").innerHTML =
          `<div style="text-align:center;padding:40px;"><div class="spinner" style="margin:0 auto;"></div></div>`;

        const postsResult = await getUserPosts(userId);
        const posts = postsResult.success ? postsResult.posts : [];

        // Split by type for the detail grid
        const textPosts = posts.filter((p) => p.type === "post");
        const videoPosts = posts.filter((p) => p.type === "video");

        const banned = user.isBanned === true;
        const pic =
          user.profilePic ||
          "https://tse1.mm.bing.net/th/id/OIP.cEvbluCvNFD_k4wC3k-_UwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3";
        const joined = formatDate(user.createdAt, {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
        const followers = getFollowersCount(user);
        const textPostCount = Number(user.postsCount) || 0;
        const videoPostCount = Number(user.videosCount) || 0;

        document.getElementById("userModalBody").innerHTML = `
                <div class="user-detail-header">
                    <img src="${pic}" onerror="this.src='https://tse1.mm.bing.net/th/id/OIP.cEvbluCvNFD_k4wC3k-_UwHaHa?rs=1&pid=ImgDetMain&o=7&rm=3'">
                    <h3>${getPrimaryName(user)}</h3>
                    ${user.displayName && user.username ? `<p style="color:var(--text-3);">@${user.username}</p>` : ""}
                    <p>${user.email || "No email"}</p>
                    <span class="badge ${banned ? "badge-banned" : "badge-active"}" style="margin-top:8px;">
                        ${banned ? "🚫 Banned" : "✅ Active"}
                    </span>
                </div>

                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-item__label">User ID</div>
                        <div class="detail-item__value mono">${user.id}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-item__label">Joined</div>
                        <div class="detail-item__value">${joined}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-item__label">Followers</div>
                        <div class="detail-item__value">${followers}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-item__label">Total Posts</div>
                      <div class="detail-item__value">${textPostCount + videoPostCount}</div>
                    </div>
                    <!-- Split post count row -->
                    <div class="detail-item">
                        <div class="detail-item__label"><i class="fas fa-newspaper" style="margin-right:4px;"></i>Text Posts</div>
                        <div class="detail-item__value">${textPostCount}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-item__label"><i class="fas fa-video" style="margin-right:4px;color:#818cf8;"></i>Video Posts</div>
                        <div class="detail-item__value" style="color:#818cf8;">${videoPostCount}</div>
                    </div>
                </div>

                ${
                  banned
                    ? `
                    <div class="ban-box">
                        <div class="ban-box__label">Ban Reason</div>
                        <div class="ban-box__value">${user.banReason || "No reason recorded"}</div>
                    </div>
                `
                    : ""
                }

                ${
                  posts.length
                    ? `
                    <div style="margin-top:16px;">
                        <div class="form-label" style="margin-bottom:8px;">Recent Posts</div>
                        <div style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">
                            ${posts
                              .slice(0, 6)
                              .map(
                                (p) => `
                                <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;">
                                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                                        <span class="text-xs text-muted">${formatDate(p.createdAt)}</span>
                                        <span style="font-size:.65rem;padding:2px 7px;border-radius:var(--r-full);background:${p.type === "video" ? "rgba(129,140,248,.15)" : "rgba(91,83,242,.12)"};color:${p.type === "video" ? "#818cf8" : "var(--accent-l)"};">
                                            ${p.type === "video" ? "🎬 Video" : "📝 Post"}
                                        </span>
                                    </div>
                                    <p class="text-sm">${(p.text || "").substring(0, 120)}${(p.text?.length || 0) > 120 ? "…" : ""}</p>
                                </div>
                            `,
                              )
                              .join("")}
                        </div>
                    </div>
                `
                    : `
                    <div style="margin-top:16px;text-align:center;padding:20px;color:var(--text-2);">
                        <i class="fas fa-newspaper" style="font-size:1.5rem;margin-bottom:8px;display:block;opacity:.4;"></i>
                        <p style="font-size:.85rem;">No posts yet</p>
                    </div>
                `
                }
            `;

        document.getElementById("userModalFooter").innerHTML = `
                <button class="btn ${banned ? "btn-success" : "btn-warning"}" id="modalBanBtn">
                    <i class="fas ${banned ? "fa-user-check" : "fa-user-slash"}"></i>
                    ${banned ? "Unban User" : "Ban User"}
                </button>
                <button class="btn btn-primary"
                        onclick="window.location.href='posts.html?user=${user.id}'">
                    <i class="fas fa-newspaper"></i> View All Posts
                </button>
            `;

        document
          .getElementById("modalBanBtn")
          .addEventListener("click", async function () {
            const restore = setButtonLoading(this, "");
            await toggleBanFromModal(user.id, banned);
            restore();
          });
      };

      async function toggleBanFromModal(userId, isBanned) {
        const confirmed = await showConfirm({
          title: isBanned ? "Unban user?" : "Ban user?",
          message: isBanned
            ? "Restore full access."
            : "Remove posting ability.",
          confirmText: isBanned ? "Unban" : "Ban",
          intent: isBanned ? "warning" : "danger",
        });
        if (!confirmed) return;

        showLoading(isBanned ? "Unbanning…" : "Banning…");
        try {
          const result = isBanned
            ? await unbanUser(userId)
            : await banUser(userId, "Admin action");
          if (result.success) {
            showToast(result.message, "success");
            document.getElementById("userModal").classList.remove("open");
            await loadUsers();
          } else {
            showToast("Error: " + result.error, "error");
          }
        } finally {
          hideLoading();
        }
      }

      document
        .getElementById("closeUserModal")
        .addEventListener("click", () =>
          document.getElementById("userModal").classList.remove("open"),
        );
      document.getElementById("userModal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("userModal"))
          document.getElementById("userModal").classList.remove("open");
      });

      // ================================================================
      // PAGINATION
      // ================================================================

      document.getElementById("prevPage").addEventListener("click", async () => {
        await loadUsers(currentPage - 1);
      });
      document.getElementById("nextPage").addEventListener("click", async () => {
        await loadUsers(currentPage + 1);
      });

      // ================================================================
      // FILTERS, SEARCH, SORT
      // ================================================================

      document.querySelectorAll(".filter-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".filter-chip")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          currentFilter = btn.dataset.filter;
          applyFiltersAndSort();
          renderTable();
        });
      });

      let searchTimer;
      document.getElementById("searchInput").addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          applyFiltersAndSort();
          renderTable();
        }, 300);
      });

      document.getElementById("sortSelect").addEventListener("change", () => {
        applyFiltersAndSort();
        renderTable();
      });

      // ================================================================
      // EXPORT CSV
      // ================================================================

      document.getElementById("exportBtn").addEventListener("click", () => {
        if (!filteredUsers.length) {
          showToast("No users to export.", "error");
          return;
        }

        const rows = filteredUsers.map((u) => {
          const textPostCount = Number(u.postsCount) || 0;
          const videoPostCount = Number(u.videosCount) || 0;
          return {
            ID: u.id,
            DisplayName: getPrimaryName(u),
            Username: u.username || "",
            Email: u.email || "",
            Status:
              u.isBanned === true ? "Banned" : "Active",
            TextPosts: textPostCount,
            VideoPosts: videoPostCount,
            TotalPosts: textPostCount + videoPostCount,
            Followers: getFollowersCount(u),
            Joined: formatDate(u.createdAt),
          };
        });

        const csv = [
          Object.keys(rows[0]).join(","),
          ...rows.map((r) =>
            Object.values(r)
              .map((v) => `"${String(v).replace(/"/g, '""')}"`)
              .join(","),
          ),
        ].join("\n");

        const a = Object.assign(document.createElement("a"), {
          href: URL.createObjectURL(new Blob([csv], { type: "text/csv" })),
          download: "joyin-users.csv",
        });
        a.click();
        showToast("CSV exported.", "success");
      });

      // ── Init ──
      loadUsers();
    </script>
  </body>
</html>
