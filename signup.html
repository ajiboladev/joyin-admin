<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>JOYIN Admin — Create Account</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" type="image/x-icon" href="/J _ A192.png" />
    <link rel="manifest" href="/admin-manifest.json" />
    <meta name="theme-color" content="#5b53f2" />
    <script src="/admin-pwa-install.js"></script>

    <style>
      /* Reuse blob animation from login */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.1;
        pointer-events: none;
        animation: blobFloat 18s ease-in-out infinite;
      }
      .blob-1 {
        width: 350px;
        height: 350px;
        background: var(--accent);
        top: -140px;
        right: -60px;
      }
      .blob-2 {
        width: 220px;
        height: 220px;
        background: #7b74f5;
        bottom: -80px;
        left: 0;
        animation-delay: -7s;
      }
      @keyframes blobFloat {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(15px, 25px) scale(1.05);
        }
        66% {
          transform: translate(-12px, 12px) scale(0.95);
        }
      }

      /* Password strength bar */
      .strength-bar {
        height: 4px;
        border-radius: 4px;
        background: var(--surface-3);
        margin-top: 8px;
        overflow: hidden;
      }
      .strength-fill {
        height: 100%;
        border-radius: 4px;
        transition:
          width 0.35s ease,
          background 0.35s ease;
        width: 0%;
      }
      .strength-label {
        font-size: 0.72rem;
        margin-top: 5px;
        transition: color 0.2s;
      }

      /* Input with icon prefix */
      .input-wrap {
        position: relative;
      }
      .input-wrap .form-input {
        padding-right: 44px;
      }
      .toggle-pw {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-3);
        cursor: pointer;
        font-size: 0.9rem;
        padding: 4px;
        transition: color 0.2s;
      }
      .toggle-pw:hover {
        color: var(--text);
      }

      /* Success card */
      .success-card {
        text-align: center;
        padding: 20px 0;
      }
      .success-card__icon {
        width: 64px;
        height: 64px;
        background: var(--success-dim);
        border: 1px solid rgba(34, 197, 94, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        color: var(--success);
        margin: 0 auto 16px;
        animation: scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes scaleIn {
        from {
          transform: scale(0);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .success-card h3 {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }
      .success-card p {
        font-size: 0.875rem;
        color: var(--text-2);
      }
    </style>
  </head>
  <body>
    <div
      class="login-container"
      style="overflow: hidden; align-items: flex-start; padding-top: 40px"
    >
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>

      <div class="login-card" style="max-width: 440px">
        <!-- Logo -->
        <div class="login-logo">
          <div class="login-logo__icon">
            <i class="fas fa-user-shield"></i>
          </div>
          <h1>JOYIN<span>Admin</span></h1>
          <p>Create Admin Account</p>
        </div>

        <!-- Form (replaced by success card on completion) -->
        <form id="signupForm" novalidate>
          <!-- Username -->
          <div class="form-group">
            <label class="form-label" for="username">
              <i
                class="fas fa-user"
                style="margin-right: 6px; color: var(--accent)"
              ></i>
              Username
            </label>
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="admin_john"
              required
              minlength="3"
            />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">
              <i
                class="fas fa-envelope"
                style="margin-right: 6px; color: var(--accent)"
              ></i>
              Admin Email
            </label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="admin@joyin.com"
              required
              autocomplete="email"
            />
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">
              <i
                class="fas fa-lock"
                style="margin-right: 6px; color: var(--accent)"
              ></i>
              Password
            </label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="••••••••"
                required
                minlength="6"
              />
              <button type="button" class="toggle-pw" id="togglePw1">
                <i class="fas fa-eye" id="twIcon1"></i>
              </button>
            </div>
            <!-- Strength meter -->
            <div class="strength-bar">
              <div class="strength-fill" id="strengthFill"></div>
            </div>
            <div class="strength-label text-faint" id="strengthLabel">
              Enter a password
            </div>
          </div>

          <!-- Confirm password -->
          <div class="form-group">
            <label class="form-label" for="confirmPassword">
              <i
                class="fas fa-lock"
                style="margin-right: 6px; color: var(--accent)"
              ></i>
              Confirm Password
            </label>
            <div class="input-wrap">
              <input
                type="password"
                id="confirmPassword"
                class="form-input"
                placeholder="••••••••"
                required
              />
              <button type="button" class="toggle-pw" id="togglePw2">
                <i class="fas fa-eye" id="twIcon2"></i>
              </button>
            </div>
            <div
              class="strength-label text-faint"
              id="matchLabel"
              style="min-height: 16px"
            ></div>
          </div>

          <!-- Admin secret key -->
          <div class="form-group">
            <label class="form-label" for="adminKey">
              <i
                class="fas fa-key"
                style="margin-right: 6px; color: var(--accent)"
              ></i>
              Admin Secret Key
            </label>
            <input
              type="password"
              id="adminKey"
              class="form-input"
              placeholder="Enter secret key"
              required
            />
            <div class="strength-label text-faint" style="margin-top: 5px">
              <i class="fas fa-info-circle"></i> Required for first-time setup
            </div>
          </div>

          <!-- Error message -->
          <div
            id="errorMessage"
            class="error-message"
            style="display: none; margin-bottom: 14px"
          ></div>

          <!-- Submit button -->
          <button type="submit" class="login-btn" id="submitBtn">
            <i class="fas fa-user-plus"></i> Create Admin Account
          </button>
        </form>

        <!-- Sign-in link -->
        <div
          id="formFooter"
          style="
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
          "
        >
          <p style="font-size: 0.82rem; color: var(--text-3)">
            Already have an account?
            <a
              href="index.html"
              style="color: var(--accent-l); font-weight: 600; margin-left: 4px"
            >
              Sign In
              <i class="fas fa-arrow-right" style="font-size: 0.7rem"></i>
            </a>
          </p>
          <p style="font-size: 0.72rem; color: var(--text-3); margin-top: 10px">
            <i
              class="fas fa-exclamation-triangle"
              style="color: var(--warning)"
            ></i>
            Admin accounts have full access to all user data.
          </p>
        </div>
      </div>
    </div>

    <script type="module">
      import { createAdmin } from "./js/auth.js";

      // ── Admin secret key (change this before deploying!) ──
      const ADMIN_SETUP_KEY = "JOYIN_ADMIN_SETUP";

      const form = document.getElementById("signupForm");
      const errMsg = document.getElementById("errorMessage");
      const btn = document.getElementById("submitBtn");
      const pwInput = document.getElementById("password");
      const cpInput = document.getElementById("confirmPassword");

      // ── Toggle password visibility helpers ──
      function setupToggle(btnId, iconId, inputId) {
        document.getElementById(btnId).addEventListener("click", () => {
          const input = document.getElementById(inputId);
          const icon = document.getElementById(iconId);
          const hidden = input.type === "password";
          input.type = hidden ? "text" : "password";
          icon.className = `fas fa-eye${hidden ? "-slash" : ""}`;
        });
      }
      setupToggle("togglePw1", "twIcon1", "password");
      setupToggle("togglePw2", "twIcon2", "confirmPassword");

      // ── Password strength meter ──
      pwInput.addEventListener("input", () => {
        const { percent, label, color } = strengthOf(pwInput.value);
        document.getElementById("strengthFill").style.width = percent + "%";
        document.getElementById("strengthFill").style.background = color;
        document.getElementById("strengthLabel").textContent = label;
        document.getElementById("strengthLabel").style.color = color;
        checkMatch(); // re-check match as well
      });

      /**
       * Evaluates password strength.
       * Returns { percent, label, color } used for the visual indicator.
       */
      function strengthOf(pw) {
        if (!pw)
          return {
            percent: 0,
            label: "Enter a password",
            color: "var(--text-3)",
          };
        if (pw.length < 6)
          return { percent: 15, label: "Too short", color: "#f87171" };

        let score = 0;
        if (pw.length >= 8) score++;
        if (pw.length >= 12) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[a-z]/.test(pw)) score++;
        if (/\d/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;

        if (score <= 2) return { percent: 33, label: "Weak", color: "#f87171" };
        if (score <= 4)
          return { percent: 66, label: "Medium", color: "var(--warning)" };
        return { percent: 100, label: "Strong", color: "var(--success)" };
      }

      // ── Confirm password match feedback ──
      cpInput.addEventListener("input", checkMatch);

      function checkMatch() {
        const lbl = document.getElementById("matchLabel");
        if (!cpInput.value) {
          lbl.textContent = "";
          return;
        }
        if (cpInput.value === pwInput.value) {
          lbl.textContent = "✓ Passwords match";
          lbl.style.color = "var(--success)";
        } else {
          lbl.textContent = "✗ Passwords do not match";
          lbl.style.color = "#f87171";
        }
      }

      // ── Form submission ──
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errMsg.style.display = "none";

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = pwInput.value;
        const confirm = cpInput.value;
        const adminKey = document.getElementById("adminKey").value;

        // ── Client-side validation ──
        if (password !== confirm) {
          showError("Passwords do not match.");
          return;
        }
        if (password.length < 6) {
          showError("Password must be at least 6 characters.");
          return;
        }
        if (adminKey !== ADMIN_SETUP_KEY) {
          showError("Invalid admin secret key.");
          return;
        }

        // ── Loading state ──
        btn.disabled = true;
        btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Creating account…`;

        try {
          const result = await createAdmin(email, password, username);

          if (result.success) {
            // ── Replace form with success card ──
            form.innerHTML = `
                        <div class="success-card">
                            <div class="success-card__icon"><i class="fas fa-check"></i></div>
                            <h3>Account created!</h3>
                            <p>Welcome to JOYIN Admin.<br>Redirecting to login…</p>
                            <p style="font-size:.72rem;color:var(--text-3);margin-top:12px;font-family:var(--mono);">
                                ID: ${result.userId.substring(0, 16)}…
                            </p>
                        </div>
                    `;
            document.getElementById("formFooter").style.display = "none";

            // Save email for convenience on login page
            localStorage.setItem("adminEmail", email);

            setTimeout(() => (window.location.href = "index.html"), 3000);
          } else {
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-user-plus"></i> Create Admin Account`;
            showError(friendlyError(result.error));
          }
        } catch (err) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fas fa-user-plus"></i> Create Admin Account`;
          showError("System error: " + err.message);
        }
      });

      /** Shows a formatted error message. */
      function showError(msg) {
        errMsg.textContent = msg;
        errMsg.style.display = "block";
      }

      /**
       * Maps Firebase error codes to friendly messages
       * so the user doesn't see raw SDK strings.
       */
      function friendlyError(msg = "") {
        if (msg.includes("email-already-in-use"))
          return "This email is already registered.";
        if (msg.includes("weak-password"))
          return "Password is too weak — choose something stronger.";
        if (msg.includes("invalid-email"))
          return "Please enter a valid email address.";
        return msg || "Account creation failed.";
      }

      // ── Auto-fill saved email ──
      const savedEmail = localStorage.getItem("adminEmail");
      if (savedEmail) document.getElementById("email").value = savedEmail;
    </script>
  </body>
</html>
