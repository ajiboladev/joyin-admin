<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JOYIN Admin - Create Account</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <link rel="icon" type="image/x-icon" href="/J _ A192.png">

    <link rel="manifest" href="/admin-manifest.json">
<meta name="theme-color" content="#5b53f2">
<script src="/admin-pwa-install.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card" style="max-width: 450px;">
            <div class="login-logo">
                <h1>JOYIN<span>Admin</span></h1>
                <p style="color: var(--text-secondary); margin-top: 8px;">Create Admin Account</p>
            </div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Admin Username</label>
                    <input type="text" id="username" placeholder="e.g., admin_john" required minlength="3">
                </div>
                
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Admin Email</label>
                    <input type="email" id="email" placeholder="admin@joyin.com" required>
                </div>
                
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                    <small style="color: var(--text-secondary); display: block; margin-top: 5px;">
                        Minimum 6 characters
                    </small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                </div>
                
                <div class="form-group">
                    <label for="adminKey"><i class="fas fa-key"></i> Admin Secret Key</label>
                    <input type="password" id="adminKey" placeholder="Enter admin key" required>
                    <small style="color: var(--text-secondary); display: block; margin-top: 5px;">
                        Required for first-time setup
                    </small>
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-user-plus"></i> Create Admin Account
                </button>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="error-message" style="display: none; color: var(--success);"></div>
            </form>
            
            <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--card-border);">
                <p style="color: var(--text-secondary);">
                    Already have an account? 
                    <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </a>
                </p>
                <p style="color: var(--warning); font-size: 12px; margin-top: 15px;">
                    <i class="fas fa-exclamation-triangle"></i> 
                    Admin accounts have full access to all user data and controls.
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createAdmin } from './js/auth.js';
        
        // Set your admin key here (change this to something secure!)
        const ADMIN_SETUP_KEY = "JOYIN_ADMIN_SETUP";
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const adminKey = document.getElementById('adminKey').value;
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const submitBtn = e.target.querySelector('button');
            
            // Clear messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Validation
            if (password !== confirmPassword) {
                errorMessage.textContent = "Passwords don't match";
                errorMessage.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMessage.textContent = "Password must be at least 6 characters";
                errorMessage.style.display = 'block';
                return;
            }
            
            if (adminKey !== ADMIN_SETUP_KEY) {
                errorMessage.textContent = "Invalid admin key";
                errorMessage.style.display = 'block';
                return;
            }
            
            // Show loading
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            submitBtn.disabled = true;
            
            // Create admin
            const result = await createAdmin(email, password, username);
            
            if (result.success) {
                successMessage.innerHTML = `
                    <i class="fas fa-check-circle"></i> 
                    Admin account created successfully!<br>
                    <small>User ID: ${result.userId.substring(0, 16)}...</small>
                `;
                successMessage.style.display = 'block';
                
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Account Created!';
                
                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                
                // Store admin email for convenience
                localStorage.setItem('adminEmail', email);
                
            } else {
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Admin Account';
                submitBtn.disabled = false;
                
                errorMessage.textContent = result.error || 'Account creation failed';
                errorMessage.style.display = 'block';
                
                // Specific error handling
                if (result.error.includes('email-already-in-use')) {
                    errorMessage.textContent = "This email is already registered";
                } else if (result.error.includes('weak-password')) {
                    errorMessage.textContent = "Password is too weak";
                } else if (result.error.includes('invalid-email')) {
                    errorMessage.textContent = "Invalid email address";
                }
            }
        });
        
        // Auto-fill email if stored
        const savedEmail = localStorage.getItem('adminEmail');
        if (savedEmail) {
            document.getElementById('email').value = savedEmail;
        }
        
        // Add password strength indicator
        const passwordInput = document.getElementById('password');
        passwordInput.addEventListener('input', function() {
            const strength = checkPasswordStrength(this.value);
            const indicator = document.getElementById('passwordStrength') || 
                (() => {
                    const div = document.createElement('div');
                    div.id = 'passwordStrength';
                    div.style.cssText = 'font-size: 12px; margin-top: 5px;';
                    this.parentNode.appendChild(div);
                    return div;
                })();
            
            indicator.innerHTML = `Strength: <span style="color:${strength.color}">${strength.text}</span>`;
        });
        
        function checkPasswordStrength(password) {
            if (password.length === 0) return { text: 'None', color: '#aaa' };
            if (password.length < 6) return { text: 'Weak', color: '#ff4757' };
            
            const hasUpper = /[A-Z]/.test(password);
            const hasLower = /[a-z]/.test(password);
            const hasNumber = /\d/.test(password);
            const hasSpecial = /[^A-Za-z0-9]/.test(password);
            
            let score = 0;
            if (hasUpper) score++;
            if (hasLower) score++;
            if (hasNumber) score++;
            if (hasSpecial) score++;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            
            if (score <= 2) return { text: 'Weak', color: '#ff4757' };
            if (score <= 4) return { text: 'Medium', color: '#ffa502' };
            return { text: 'Strong', color: '#2ed573' };
        }
    </script>
</body>
</html>
