<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support Request — JOYIN Admin</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" href="/J _ A192.png" />
    <style>
      .support-shell {
        max-width: 1100px;
        margin: 0 auto;
      }
      .support-list {
        display: grid;
        gap: 16px;
        margin-top: 20px;
      }
      .support-card {
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 18px;
      }
      .support-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .support-badges {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .issue-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: rgba(91, 83, 242, 0.12);
        color: var(--accent-l);
        border: 1px solid rgba(91, 83, 242, 0.25);
      }
      .issue-pill.other {
        background: rgba(148, 163, 184, 0.12);
        color: #cbd5e1;
        border-color: rgba(148, 163, 184, 0.2);
      }
      .issue-pill.bug {
        background: rgba(239, 68, 68, 0.12);
        color: #fca5a5;
        border-color: rgba(239, 68, 68, 0.25);
      }
      .issue-pill.account {
        background: rgba(251, 146, 60, 0.12);
        color: #fdba74;
        border-color: rgba(251, 146, 60, 0.25);
      }
      .issue-pill.payment {
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
        border-color: rgba(34, 197, 94, 0.25);
      }
      .issue-pill.security {
        background: rgba(236, 72, 153, 0.12);
        color: #f9a8d4;
        border-color: rgba(236, 72, 153, 0.25);
      }
      .support-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        padding: 12px 14px;
        margin-top: 12px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .support-meta-row span {
        color: var(--text-2);
        font-size: 0.88rem;
        word-break: break-word;
      }
      .support-issue-box {
        margin-top: 14px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
      }
      .support-issue-box strong,
      .support-text-box strong {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
      }
      .support-text-box {
        margin-top: 14px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
      }
      .support-text-box p {
        margin: 0;
        color: var(--text);
        line-height: 1.75;
        white-space: pre-wrap;
      }
      .support-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .empty-state {
        padding: 50px 20px;
        text-align: center;
        color: var(--text-2);
      }
      @media (max-width: 600px) {
        .support-meta-row {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__logo"><i class="fas fa-crown"></i> JOYIN Admin</div>
      <nav class="sidebar__nav">
        <a href="dashboard.html" class="nav-link"
          ><i class="fas fa-chart-line"></i> Dashboard</a
        >
        <a href="users.html" class="nav-link"
          ><i class="fas fa-users"></i> Users</a
        >
        <a href="posts.html" class="nav-link"
          ><i class="fas fa-newspaper"></i> Posts</a
        >
        <a href="./Admin-feedback/feedback-admin.html" class="nav-link"
          ><i class="fas fa-comment-dots"></i> Feedback</a
        >
        <a href="support-request.html" class="nav-link active"
          ><i class="fas fa-headset"></i> Support request</a
        >
        <a href="./updates/" class="nav-link"
          ><i class="fas fa-bell"></i> Updates</a
        >
        <a href="video-posts/" class="nav-link"
          ><i class="fas fa-video"></i> Video Posts</a
        >
        <a href="content-search.html" class="nav-link"
          ><i class="fas fa-search"></i> Search Content</a
        >
        <a href="content-delete.html" class="nav-link"
          ><i class="fas fa-trash"></i> Delete Content</a
        >
        <a href="delete-requests.html" class="nav-link"
          ><i class="fas fa-file-circle-xmark"></i> P-delete request</a
        >
        <a href="video-delete-requests.html" class="nav-link"
          ><i class="fas fa-video-slash"></i> V-delete request</a
        >
        <a href="account-delete-requests.html" class="nav-link"
          ><i class="fas fa-user-xmark"></i> Acc-delete request</a
        >
      </nav>
      <div class="sidebar__footer">
        <button id="logoutBtn" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <header class="topbar">
      <div class="topbar__title">
        <button class="hamburger" id="hamburger">
          <span></span><span></span><span></span></button
        ><i class="fas fa-headset"></i> Support request
      </div>
    </header>
    <main class="page-content">
      <div class="support-shell">
        <div class="card">
          <div class="card-header request-toolbar">
            <span class="card-title"
              ><i class="fas fa-headset"></i> Support requests</span
            >
            <button id="fetchBtn" class="btn btn-primary">
              <i class="fas fa-cloud-arrow-down"></i> Load support requests
            </button>
          </div>
          <div id="requestList" class="support-list"></div>
          <div
            id="loadMoreWrap"
            style="display: none; text-align: center; margin-top: 18px"
          >
            <button id="loadMoreBtn" class="btn">
              <i class="fas fa-plus"></i> Load more
            </button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="js/support-request-page.js"></script>
  </body>
</html>
